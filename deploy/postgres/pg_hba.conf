# PostgreSQL client authentication for the local single-machine topology (docs/m5-protocol.md §4.3, ADR-0013 rev.).
# First match wins. Holdout rules name the evaluator's static IP only, so they hold whatever source address Docker
# Desktop gives to connections through the loopback-published port. Superuser: local socket only.
# TYPE  DATABASE                 USER                                                         ADDRESS           METHOD
local   all                      all                                                                            scram-sha-256
host    all                      pi_dev                                                       0.0.0.0/0         reject
host    holdout,holdout_henv     eval_owner,eval_registry,eval_diagnostic,eval_prospective    172.30.3.20/32    scram-sha-256
host    holdout,holdout_henv     all                                                          0.0.0.0/0         reject
host    ops                      status_relay                                                 172.30.3.20/32    scram-sha-256
host    ops                      status_relay                                                 0.0.0.0/0         reject
host    ops                      trading_app,ops_api                                          172.30.1.20/32    scram-sha-256
host    ops                      research_app                                                 172.30.1.30/32    scram-sha-256
host    ops                      ops_owner,research_app,market_import                         samenet           scram-sha-256
host    all                      all                                                          0.0.0.0/0         reject
host    all                      all                                                          ::/0              reject
