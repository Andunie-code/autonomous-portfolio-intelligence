# M0-M2 local development only. The target single-machine topology (one PostgreSQL instance with
# separate ops and holdout databases, four networks, resource limits) is described in docs/adr/0013
# and arrives with M3/M5. There is deliberately no holdout service here yet.
name: portfolio-intelligence

services:
  dev-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio_dev
      POSTGRES_USER: pi_dev
      POSTGRES_PASSWORD: ${PI_DEV_DB_PASSWORD:?PI_DEV_DB_PASSWORD missing; run scripts/dev-up.ps1 to create .env}
    ports:
      - "127.0.0.1:${PI_DEV_DB_PORT:-55432}:5432"   # loopback only
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pi_dev -d portfolio_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dev-db-data:
